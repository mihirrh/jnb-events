# Rebuilds the site once a day so new Instagram posts appear without anyone touching the repo.
# Setup: Cloudflare Pages -> Settings -> Builds -> Deploy hooks -> create one, then add its URL as a
# GitHub repository secret named CF_PAGES_DEPLOY_HOOK (Settings -> Secrets and variables -> Actions).
name: Daily rebuild

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Cloudflare Pages build
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice title=Deploy Hook Skipped::CF_PAGES_DEPLOY_HOOK secret is not set in GitHub repository settings. Set it up in repo Settings -> Secrets and variables -> Actions to enable daily automatic Instagram rebuilds."
            exit 0
          fi
          echo "Triggering Cloudflare Pages rebuild..."
          curl --fail --silent --show-error --max-time 30 -X POST "$HOOK" > /dev/null
          echo "Rebuild successfully triggered."
