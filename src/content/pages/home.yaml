seo:
  title: Wedding Décor, Mandaps & DJ in Leicester | JNB Events
  description: JNB Events creates bespoke wedding and event styling in Leicester - mandaps, civil ceremony décor, centrepieces, DJ and dancefloor. Covering Leicestershire and the UK.
hero:
  eyebrow: Leicester · Leicestershire · UK-wide
  headline: Weddings & events, styled with intent.
  subheading: Bespoke mandaps, ceremony and reception décor, DJ and dancefloor effects - designed around your day and delivered with care.
